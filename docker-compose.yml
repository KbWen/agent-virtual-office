services:
  office:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-virtual-office
    ports:
      # Loopback only — safe behind Nginx.
      # For direct LAN access without a reverse proxy, change to "5174:5174"
      # AND set OFFICE_API_TOKEN in the environment block below — otherwise
      # the write API is unauthenticated and reachable by anyone on the LAN.
      - "127.0.0.1:5174:5174"
    environment:
      OFFICE_API_TOKEN: ${OFFICE_API_TOKEN:-}
      # REQUIRED if this container sits behind Nginx (or any reverse proxy) using a hostname:
      # server.mjs validates the Host header (DNS-rebinding guard) and compose does NOT
      # forward a shell var into the container unless it's listed here — an unset
      # OFFICE_ALLOWED_HOSTS in your shell silently becomes an unset one in the container too,
      # so "I set it in my .env" isn't enough on its own. Set it to your proxy's server_name,
      # e.g.: OFFICE_ALLOWED_HOSTS=office.example.com docker compose up -d
      OFFICE_ALLOWED_HOSTS: ${OFFICE_ALLOWED_HOSTS:-}
      NODE_ENV: production
    volumes:
      # :rw so the server can write office-status.json (POST /api/status).
      # Hooks on the host write directly to this directory too.
      #
      # IMPORTANT — before first run, ensure the directory exists and is owned
      # by UID 1000 (the container's "node" user) so writes succeed:
      #   mkdir -p ~/.claude && sudo chown 1000 ~/.claude
      #
      # ${HOME} resolves to the *current user's* home. If you run docker compose
      # under sudo, ${HOME} becomes /root — set it explicitly instead:
      #   COMPOSE_FILE=docker-compose.yml HOME=/home/youruser docker compose up -d
      - ${HOME:?HOME must be set (e.g. export HOME=/home/youruser)}/.claude:/home/node/.claude:rw
    mem_limit: 256m
    init: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5174/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
