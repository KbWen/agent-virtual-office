# Nginx reverse proxy for agent-virtual-office.
# Copy to /etc/nginx/sites-available/office.conf, then:
#   sudo ln -s /etc/nginx/sites-available/office.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# server.mjs runs on 127.0.0.1:5174 WITHOUT --host (loopback only).
# Start it with: node server.mjs --no-open   (no --host flag)

# Rate-limit zone: 10 req/s per client IP, 10 MB state table.
limit_req_zone $binary_remote_addr zone=office_api:10m rate=10r/s;

server {
    listen 80;
    # Change to your domain or server IP.
    server_name office.example.com;

    # For HTTPS (recommended), obtain a cert first:
    #   sudo apt install certbot python3-certbot-nginx
    #   sudo certbot --nginx -d office.example.com
    # Then Certbot edits this file to add the 443 block automatically.
    # Also uncomment the HSTS header below once HTTPS is confirmed working.

    server_tokens off;
    client_max_body_size 16k;   # matches server.mjs 16 384-byte body cap
    keepalive_timeout 65s;

    # gzip for static assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Security headers (applied globally; repeated in /api/ to avoid override).
    add_header X-Frame-Options        "SAMEORIGIN"                         always;
    add_header X-Content-Type-Options "nosniff"                            always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;
    # Uncomment only after HTTPS is working end-to-end:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:5174;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / connection-upgrade support (future live-update path).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # API endpoints: rate-limit writes, prevent caching.
    # Note: add_header here replaces server-level headers, so repeat them.
    location /api/ {
        limit_req zone=office_api burst=20 nodelay;

        proxy_pass http://127.0.0.1:5174;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # Repeat security headers (add_header in location replaces server-level ones).
        add_header X-Frame-Options        "SAMEORIGIN"                         always;
        add_header X-Content-Type-Options "nosniff"                            always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin"    always;
        add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
}
