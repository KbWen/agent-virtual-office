# Nginx reverse proxy for agent-virtual-office.
# Copy this into /etc/nginx/sites-available/ then symlink to sites-enabled/.
# server.mjs runs on 127.0.0.1:5174 (start it with `node server.mjs --host --no-open`).

server {
    listen 80;
    # Change this to your domain or server IP.
    server_name office.example.com;

    # For HTTPS, listen on 443 instead and add your certificates:
    #   listen 443 ssl;
    #   ssl_certificate     /etc/letsencrypt/live/office.example.com/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/office.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:5174;

        # Forward client information to server.mjs.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / connection upgrade support (for future live updates).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection 'upgrade';
    }

    # API responses must never be cached by browsers or intermediaries.
    location /api/ {
        proxy_pass http://127.0.0.1:5174;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires off;
    }
}
